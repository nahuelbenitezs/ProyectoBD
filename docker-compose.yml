# Levanta MySQL (con torneo_ucu_creacion.sql + sesiones.sql), la API y el frontend.
#   docker compose up -d --build
# Las claves se toman de .env en la raíz (ver .env.example).
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD en .env}
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ADMIN_PASSWORD:?Definí MYSQL_ADMIN_PASSWORD en .env}
      MYSQL_PLANILLERO_PASSWORD: ${MYSQL_PLANILLERO_PASSWORD:?Definí MYSQL_PLANILLERO_PASSWORD en .env}
      TZ: America/Montevideo
    # Hora de Uruguay: los triggers comparan NOW() con el día y turno del partido.
    command: ["--default-time-zone=-03:00", "--character-set-server=utf8mb4",
              "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./torneo_ucu_creacion.sql:/sql/torneo_ucu_creacion.sql:ro
      - ./backend/sql/sesiones.sql:/sql/sesiones.sql:ro
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -utorneo_app_administrador -p\"$$MYSQL_ADMIN_PASSWORD\" -e 'SELECT 1 FROM torneo_ucu.sesion_api LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 40

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: torneo_ucu
      MYSQL_ADMIN_USER: torneo_app_administrador
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ADMIN_PASSWORD}
      MYSQL_PLANILLERO_USER: torneo_app_planillero
      MYSQL_PLANILLERO_PASSWORD: ${MYSQL_PLANILLERO_PASSWORD}
      CORS_ORIGINS: http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080
      HOST: 0.0.0.0
      PORT: 5000
    ports:
      - "5000:5000"

  # Pruebas del backend (unitarias + integración contra el MySQL del servicio db).
  # Solo se ejecuta a pedido: docker compose run --rm tests
  tests:
    build: ./backend
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: torneo_ucu
      MYSQL_ADMIN_USER: torneo_app_administrador
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ADMIN_PASSWORD}
      MYSQL_PLANILLERO_USER: torneo_app_planillero
      MYSQL_PLANILLERO_PASSWORD: ${MYSQL_PLANILLERO_PASSWORD}
      RUN_INTEGRATION: "1"
    volumes:
      - ./backend/tests:/app/tests:ro
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
